# golangci-lint configuration for fo (strict)
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  tests: true

output:
  formats:
    text:
      print-linter-name: true
      print-issued-lines: true
      colors: true
    sarif:
      path: build/golangci.sarif

linters:
  # bugclasses baseline floor (ccp-sbp.2, decision nug d7ea466a8172): keeps
  # golangci's standard set (errcheck, govet, ineffassign, staticcheck, unused)
  # under fo's richer config — the floor is never below the shared six.
  default: standard

  enable:
    # Error handling
    - err113
    - errchkjson
    - errorlint
    - nilerr
    - nilnesserr
    - rowserrcheck  # floor: sql.Rows.Err() unchecked (no-op without database/sql)
    - staticcheck   # floor: explicit, though a standard default

    # Safety
    - bodyclose
    - containedctx
    - forbidigo
    - forcetypeassert
    - gosec
    - noctx
    - predeclared

    # Complexity
    - cyclop
    - funlen
    - gocognit
    - gocyclo
    - nestif

    # Enum & type safety
    - exhaustive
    - makezero
    - musttag
    - reassign

    # Style & correctness
    - asciicheck
    - copyloopvar
    - dupword
    - durationcheck
    - errname
    - exptostd
    - fatcontext
    - gocheckcompilerdirectives
    - gochecknoinits
    - goconst
    - gocritic
    - grouper
    - inamedparam
    - intrange
    - iotamixing
    - misspell
    - modernize
    - nakedret
    - nilnil
    - nolintlint
    - prealloc
    - recvcheck
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign

    # Performance
    - mirror
    - perfsprint

    # Testing
    - testifylint
    - thelper
    - usetesting

  disable:
    - godox
    - wsl

  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - fmt.Fprintf
        - fmt.Printf
        - fmt.Print
        - fmt.Println
        - fmt.Fprint
        - fmt.Fprintln
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      # bugclasses pack (ccp-sbp, decision nug d7ea466a8172): the ruleguard
      # checker runs the shared machine rules for the recurring cross-repo Go
      # defect classes. Rules live in .golangci-rules/bugclasses.go — a verbatim
      # copy of the upstream pack, drift-guarded by
      # .golangci-rules/check-pack-drift.sh (make pack-drift).
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          # ${base-path} = the .golangci.yml directory (golangci-lint v2). The
          # glob names ONLY bugclasses.go, so rule 2 (raw-state-write, the
          # opt-in file) stays off until fo moves durable state to atomicfile.
          rules: "${base-path}/.golangci-rules/bugclasses.go"
          # Fail the run on rule-compile errors — never silently skip them.
          failOn: dsl
      disabled-checks:
        - appendCombine
        - commentFormatting
        - deprecatedComment
        - hugeParam
        - ifElseChain
        - unlambda
    forbidigo:
      # bugclasses rule 5: context.Background() deep in daemon/long-lived code
      # should thread the caller/shutdown ctx (strand st-47z,
      # canapay can-x38). Path-scoped below to fo's
      # long-lived paths (watch/stream); noise everywhere else, so the
      # exclusions rule carves out the CLI entrypoint, cmd wiring, and tests.
      # Types-aware so a `ctx.Background` field can't false-fire.
      analyze-types: true
      forbid:
        - pattern: '^context\.Background$'
          msg: "thread the caller/shutdown ctx; context.Background belongs only at a daemon's root (main/startup)"
    cyclop:
      max-complexity: 15
    funlen:
      lines: 80
      statements: 40
    gocognit:
      min-complexity: 15
    gocyclo:
      min-complexity: 15
    nestif:
      min-complexity: 5
    nakedret:
      max-func-lines: 20
    revive:
      severity: warning
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: bare-return
          disabled: true
        - name: var-naming
          disabled: false
        - name: context-as-argument
          disabled: false
        - name: error-return
          disabled: false
        - name: dot-imports
          disabled: false
        - name: waitgroup-by-value
          disabled: false
    gosec:
      excludes:
        - G104  # errcheck handles this
        - G304  # File inclusion (CLI tool reads stdin/paths)
        - G306  # Loose file perms ok for build/state outputs
    staticcheck:
      checks:
        - all
        - -SA1019  # deprecated warnings (transitions)
        - -ST1000
        - -ST1020
        - -ST1022
    testifylint:
      enable-all: true
    nolintlint:
      require-explanation: true
      require-specific: true
    goconst:
      min-occurrences: 4

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Tests: relax security, complexity, ctx, unparam
      - linters: [gosec]
        path: _test\.go
      - linters: [cyclop, funlen, gocognit, gocyclo, nestif]
        path: _test\.go
      # Tests legitimately repeat literal fixtures (table-driven input/want data)
      - linters: [goconst]
        path: _test\.go
      - linters: [noctx]
        path: _test\.go
      - linters: [unparam]
        path: _test\.go
      - linters: [errcheck]
        path: _test\.go
        text: Close
      - linters: [usetesting]
        path: _test\.go
      - linters: [revive]
        path: _test\.go
        text: unused-parameter
      # CLI main.go: relax complexity, allow gosec process exec
      - linters: [cyclop, funlen, gocognit, gocyclo, nestif]
        path: cmd/.*/main\.go
      - linters: [gocritic]
        path: cmd/.*/main\.go
        text: exitAfterDefer
      - linters: [gosec]
        path: cmd/.*
        text: G204|G301|G302|G306
      # Comment dupword (e.g. "the the" inside doc lines from prose)
      - linters: [dupword]
        source: "^\\s*//"
      # bugclasses rule 5 (forbidigo Background ban): context.Background is
      # legitimate at fo's CLI root (cmd/fo), in main.go, and in tests. fo is a
      # formatting CLI, not a daemon; the ban only bites long-lived paths where
      # a fresh root context would sever cancellation.
      - linters: [forbidigo]
        path: '(_test\.go$|(^|/)cmd/|(^|/)main\.go$)'
        text: 'context\.Background'
    paths:
      - third_party$
      - examples$

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - examples$
