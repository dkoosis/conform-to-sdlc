version: "2"

# Ported from a stricter config 2026-06-11 (canapay-3hb). Depguard
# architecture rules and path exclusions dropped; add canapay depguard rules
# when package boundaries are worth enforcing.

run:
  modules-download-mode: readonly
  tests: true

linters:
  # bugclasses baseline floor (ccp-sbp.2, decision nug d7ea466a8172):
  # `standard` keeps golangci's own defaults (errcheck, govet, ineffassign,
  # staticcheck, unused) under canapay's richer config, so the shared floor is
  # never below errcheck/nilerr/rowserrcheck/noctx/staticcheck/nolintlint.
  # contextcheck is deliberately NOT enabled — advisory only (FP-dominated);
  # that defect class is owned by forbidigo rule 5 below.
  default: standard
  enable:
    # Error handling
    - err113
    - errchkjson
    - errorlint
    - nilerr
    - nilnesserr
    - wrapcheck

    # Safety
    - bodyclose
    - containedctx
    - forbidigo
    - forcetypeassert
    - gosec
    - noctx
    - predeclared
    - rowserrcheck
    - sqlclosecheck

    # Complexity
    - cyclop
    - funlen
    - gocognit
    - gocyclo
    - nestif

    # Enum & type safety
    - exhaustive
    - makezero
    - musttag
    - reassign

    # Style & correctness
    - asciicheck
    - copyloopvar
    - dupword
    - durationcheck
    - errname
    - exptostd
    - fatcontext
    - gocheckcompilerdirectives
    - gochecknoinits
    - goconst
    - gocritic
    - grouper
    - inamedparam
    - intrange
    - iotamixing
    - loggercheck
    - misspell
    - modernize
    - nakedret
    - nilnil
    - nolintlint
    - prealloc
    - recvcheck
    - revive
    - sloglint
    - staticcheck # a golangci default; named explicitly per the baseline floor
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign

    # Performance
    - mirror
    - perfsprint

    # Testing
    - testifylint
    - thelper
    - usetesting

  disable:
    - godox
    - wsl

  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - fmt.Fprintf
        - fmt.Printf
        - fmt.Print
        - fmt.Println
        - fmt.Fprint
        - fmt.Fprintln
    goconst:
      min-len: 4
      min-occurrences: 5
      ignore-tests: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      # bugclasses pack (ccp-sbp, decision nug d7ea466a8172): the ruleguard
      # checker runs the shared machine rules for the recurring cross-repo Go
      # defect classes. Rules live in .golangci-rules/bugclasses.go — a verbatim
      # copy of the upstream cc-plugins pack, drift-guarded by
      # scripts/check-pack-drift.sh.
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          # ${base-path} = the .golangci.yml directory (golangci-lint v2). The
          # glob names ONLY bugclasses.go, so rule 2 (raw-state-write, the
          # opt-in file) stays off until canapay moves durable state to
          # atomicfile.
          rules: "${base-path}/.golangci-rules/bugclasses.go"
          # Fail the run on rule-compile errors — never silently skip them.
          failOn: dsl
      disabled-checks:
        - appendCombine
        - commentFormatting
        - deprecatedComment
        - hugeParam
        - ifElseChain
        - unlambda
    forbidigo:
      # bugclasses rule 5: context.Background() deep in daemon/server code
      # should thread the caller/shutdown ctx (strand st-47z,
      # canapay can-x38 — the MCP-server variant, now
      # fixed). Path-scoped in exclusions below to canapay's daemon/network
      # surface. Types-aware so a `ctx.Background` field can't misfire.
      analyze-types: true
      forbid:
        - pattern: '^context\.Background$'
          msg: "thread the caller/shutdown ctx; context.Background belongs only at a daemon's root (main/startup)"
    # Greenfield — tight from day one
    cyclop:
      max-complexity: 15
    funlen:
      lines: 80
      statements: 40
    gocognit:
      min-complexity: 15
    gocyclo:
      min-complexity: 15
    nestif:
      min-complexity: 5
    nakedret:
      max-func-lines: 20
    revive:
      severity: warning
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: bare-return
          disabled: true
        - name: var-naming
          disabled: false
        - name: context-as-argument
          disabled: false
        - name: error-return
          disabled: false
        - name: dot-imports
          disabled: false
        - name: waitgroup-by-value
          disabled: false
    staticcheck:
      checks:
        - all
    testifylint:
      enable-all: true
    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test files: relax security, complexity, and context requirements
      - linters:
          - gosec
        path: _test\.go
      - linters:
          - cyclop
          - funlen
          - gocognit
          - gocyclo
          - nestif
        path: _test\.go
      - linters:
          - noctx
        path: _test\.go
      - linters:
          - unparam
        path: _test\.go
      # wrapcheck: test files wrap nothing meaningful — boundary wrapping is a
      # production-code concern
      - linters:
          - wrapcheck
        path: _test\.go
      # root main.go: relax complexity
      - linters:
          - cyclop
          - funlen
          - gocognit
          - gocyclo
          - nestif
        path: main\.go
      # bugclasses rule 5 (forbidigo Background ban) is noise everywhere except
      # long-lived daemon/server code. Scoped OUT for canapay's non-daemon
      # surface, where a fresh root context is legitimate:
      #   - _test.go / root main.go — roots and fixtures.
      #   - internal/cli/** — kong subcommand handlers; each roots its own
      #     top-level timeout ctx (the moral equivalent of a per-command main),
      #     incl. the MCP-server root at internal/cli/mcp.go (signal.NotifyContext
      #     — the fixed form of can-x38).
      #   - internal/state/** — the synchronous SQLite data-access library. Its
      #     public methods root their own operation ctx by design (they take no
      #     caller ctx to sever); tx-level helpers thread ctx internally. Not the
      #     daemon-cancellation defect rule 5 targets — threading ctx through the
      #     ledger API is a separate worklist, out of scope for a lint adoption.
      # Left IN scope: notify/qbo/transport/supplier/runlog — network + daemon
      # paths. The two current sites there carry a site-specific //nolint.
      - linters:
          - forbidigo
        path: '(_test\.go$|(^|/)main\.go$|(^|/)internal/cli/|(^|/)internal/state/)'
        text: 'context\.Background'

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
